name: Deploy

# Publishing a GitHub release ships the site. `workflow_dispatch` is the manual
# escape hatch — same job, no release needed.
on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # sharp pulls platform-specific optional packages, and the versions the
      # runner resolves for them drift from whatever the lockfile was generated
      # against (@emnapi/*). `npm ci` refuses that outright, so fall back to a
      # lockfile-guided install rather than pinning a tree that only reproduces
      # on one machine.
      - name: Install
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - run: npm run build

      # rsync runs with --delete, so an empty or partial dist would wipe the
      # live site. Refuse to ship one.
      - name: Verify build output
        run: |
          test -f dist/index.html || { echo "dist/index.html missing"; exit 1; }
          test -d dist/_astro || { echo "dist/_astro missing"; exit 1; }
          echo "pages: $(find dist -name '*.html' | wc -l)"

      - name: Load deploy key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Rsync to VPS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          rsync -az --delete --human-readable --stats \
            -e "ssh -p $DEPLOY_PORT -i ~/.ssh/deploy_key -o BatchMode=yes" \
            dist/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH"

      # The site sits behind Cloudflare, so a single bad response can be an edge
      # hiccup rather than a broken deploy (a 525 is the edge failing to reach
      # the origin at all). Retry before calling it a failure.
      - name: Smoke test
        run: |
          check() {
            for attempt in 1 2 3 4; do
              code=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "https://aldes.dev$1" || echo 000)
              echo "$1 -> $code (attempt $attempt)"
              [ "$code" = "200" ] && return 0
              sleep $((attempt * 10))
            done
            return 1
          }
          check / && check /work/monogram-ai/
